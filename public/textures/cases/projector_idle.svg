<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="screen-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
  </defs>

  <!-- Темный экран в режиме ожидания -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#screen-grad)" />

  <!-- Тонкая сетка проектора -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.2">
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <circle cx="960" cy="540" r="300" fill="none" />
  </g>

  <!-- Центральный значок ожидания -->
  <g transform="translate(960, 520)">
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <polygon points="-12,-20 25,0 -12,20" fill="#38bdf8" />
  </g>

  <text x="960" y="630" font-family="'Montserrat', Arial, sans-serif" font-weight="700" font-size="28" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">
    PROJECTOR STANDBY
  </text>
  <text x="960" y="670" font-family="'Courier New', monospace" font-size="18" fill="#64748b" text-anchor="middle" letter-spacing="2">
    SELECT A CASE STUDY ON THE WHITEBOARD
  </text>
</svg>
