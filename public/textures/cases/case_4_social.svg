<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" width="660" height="880">
  <defs>
    <!-- Картонная основа крафт -->
    <linearGradient id="kraft-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfc3af" />
      <stop offset="50%" stop-color="#c5b7a2" />
      <stop offset="100%" stop-color="#b8a994" />
    </linearGradient>

    <!-- Тень листа -->
    <filter id="sheet-shadow-4" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3d3326" flood-opacity="0.3" />
    </filter>

    <!-- Красный фон превью-карточки -->
    <linearGradient id="red-preview-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Золотая эмблема -->
    <radialGradient id="gold-emblem-4" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>

    <!-- Булавка -->
    <radialGradient id="pin-head-4" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>

  <!-- 1. Крафтовая подложка -->
  <rect x="0" y="0" width="660" height="880" rx="3" fill="url(#kraft-grad-4)" />
  <rect x="0" y="0" width="660" height="880" rx="3" fill="none" stroke="#aa9b86" stroke-width="1.5" />

  <!-- 2. Белый лист бумаги с полями -->
  <g filter="url(#sheet-shadow-4)">
    <rect x="35" y="35" width="590" height="810" rx="2" fill="#faf9f6" />
    <rect x="35" y="35" width="590" height="810" rx="2" fill="none" stroke="#e8e4db" stroke-width="1" />
  </g>

  <!-- 3. Содержимое твита / поста GSAP Site of the Day (точно как на фото) -->
  <g transform="translate(65, 75)">
    <!-- Аватарка аккаунта (зеленый квадрат GSAP) -->
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#10b981" />
    <text x="23" y="31" font-family="'Montserrat', Arial, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">G</text>

    <!-- Заголовок аккаунта -->
    <text x="58" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="14.5" fill="#111827">GSAP</text>
    <circle cx="108" cy="15" r="7" fill="#0284c7" />
    <path d="M105 15 L107 17 L111 13" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <text x="122" y="20" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">@greensock · 1d</text>

    <text x="58" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="12.5" fill="#15803d">
      🏆 Site of the Day — Graffico
    </text>

    <!-- Текст объявления (оригинальный текст из фото) -->
    <g transform="translate(0, 72)" font-family="Arial, sans-serif" font-size="12" fill="#374151" line-height="18">
      <text x="0" y="0">We built a digital experience to prove that B2B software doesn't have to be</text>
      <text x="0" y="18">boring. The goal was to visualize "technoclean" and "clean" emerging from chaos.</text>
      <text x="0" y="36">We used GSAP heavily to adapt a seamless, fluid transition that guides the user from</text>
      <text x="0" y="54">the problem's chaos straight to the solution's clear software. Great job by the</text>
      <text x="0" y="72">Graffico team: Andrea Fragushi and Jessica Volker https://lnkd.in/dRYGNCG</text>
      
      <text x="0" y="102" fill="#6b7280">via : Graffico-Webpage-Showcase-ThreeJS-Plugin</text>
      <text x="0" y="120" fill="#0284c7">showcase : gsap.com/showcase</text>
      
      <text x="0" y="146" fill="#9ca3af" font-size="11">#WebGL #Animations</text>
    </g>
  </g>

  <!-- 4. Нижняя красная карточка превью Graffico (как на фото) -->
  <g transform="translate(65, 360)">
    <rect x="0" y="0" width="530" height="425" rx="6" fill="url(#red-preview-4)" />
    
    <!-- Тонкая рамка внутри -->
    <rect x="0" y="0" width="530" height="425" rx="6" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.4" />

    <!-- Центральный круглый логотип на красном фоне -->
    <g transform="translate(265, 212)">
      <!-- Белый ореол вокруг эмблемы -->
      <circle cx="0" cy="0" r="75" fill="#ffffff" opacity="0.15" />
      <circle cx="0" cy="0" r="62" fill="#ffffff" opacity="0.95" />

      <!-- Золотая эмблема Graffico внутри -->
      <g transform="scale(0.8) translate(-85, -85)">
        <path d="M85 30 
                 C105 30, 125 45, 132 68 
                 C142 100, 120 132, 92 138 
                 C65 144, 38 128, 38 100 
                 C38 72, 60 55, 78 52 
                 C92 50, 98 62, 95 72 
                 C90 85, 72 88, 70 76
                 C68 68, 75 64, 82 66" 
              fill="url(#gold-emblem-4)" />

        <circle cx="85" cy="85" r="16" fill="#fef08a" opacity="0.9" />
        <circle cx="85" cy="85" r="9" fill="#92400e" />
      </g>
    </g>
  </g>

  <!-- Булавки на белом листе (сверху) -->
  <circle cx="210" cy="50" r="5" fill="url(#pin-head-4)" stroke="#475569" stroke-width="0.7" />
  <circle cx="450" cy="50" r="5" fill="url(#pin-head-4)" stroke="#475569" stroke-width="0.7" />

  <!-- Булавки по углам крафтовой основы -->
  <circle cx="20" cy="20" r="7" fill="url(#pin-head-4)" stroke="#475569" stroke-width="0.8" />
  <circle cx="640" cy="20" r="7" fill="url(#pin-head-4)" stroke="#475569" stroke-width="0.8" />
  <circle cx="20" cy="860" r="7" fill="url(#pin-head-4)" stroke="#475569" stroke-width="0.8" />
  <circle cx="640" cy="860" r="7" fill="url(#pin-head-4)" stroke="#475569" stroke-width="0.8" />
</svg>
