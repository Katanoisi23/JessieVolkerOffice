<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660" width="840" height="660">
  <defs>
    <!-- Картонная подложка крафт -->
    <linearGradient id="kraft-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfc3af" />
      <stop offset="50%" stop-color="#c5b7a2" />
      <stop offset="100%" stop-color="#b8a994" />
    </linearGradient>

    <!-- Тень листа -->
    <filter id="sheet-shadow-3" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3d3326" flood-opacity="0.3" />
    </filter>

    <!-- Булавка -->
    <radialGradient id="pin-head-3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- Базовый градиент для портретов жюри в ч/б -->
    <linearGradient id="avatar-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- 1. Крафтовая основа -->
  <rect x="0" y="0" width="840" height="660" rx="3" fill="url(#kraft-grad-3)" />
  <rect x="0" y="0" width="840" height="660" rx="3" fill="none" stroke="#aa9b86" stroke-width="1.5" />

  <!-- 2. Белый лист бумаги с полями -->
