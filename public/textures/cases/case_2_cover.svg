<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" width="660" height="880">
  <defs>
    <!-- Картонная подложка крафт -->
    <linearGradient id="kraft-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfc3af" />
      <stop offset="50%" stop-color="#c5b7a2" />
      <stop offset="100%" stop-color="#b8a994" />
    </linearGradient>

    <!-- Тень листа -->
    <filter id="sheet-shadow-2" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3d3326" flood-opacity="0.3" />
    </filter>

    <!-- Градиент для 3D выпечки / круассана -->
    <radialGradient id="pastry-glow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Булавка -->
    <radialGradient id="pin-head-2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>

  <!-- 1. Крафтовая подложка -->
  <rect x="0" y="0" width="660" height="880" rx="3" fill="url(#kraft-grad-2)" />
  <rect x="0" y="0" width="660" height="880" rx="3" fill="none" stroke="#aa9b86" stroke-width="1.5" />

  <!-- 2. Белый лист бумаги -->
  <g filter="url(#sheet-shadow-2)">
    <rect x="35" y="35" width="590" height="810" rx="2" fill="#faf9f6" />
    <rect x="35" y="35" width="590" height="810" rx="2" fill="none" stroke="#e8e4db" stroke-width="1" />
  </g>

  <!-- 3. Верхняя темная секция постера (как на фото) -->
  <rect x="35" y="35" width="590" height="430" fill="#0d0d10" />

  <!-- Заголовок GRAFFICO -->
  <text x="330" y="110" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="46" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="4">
    GRAFFICO
  </text>

  <!-- Центральный 3D объект: фирменная выпечка / круассан Graffico -->
  <g transform="translate(330, 260)">
    <!-- Тонкие орбитальные линии / световые кольца -->
    <ellipse cx="0" cy="0" rx="140" ry="48" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.35" transform="rotate(-18)" />
    <ellipse cx="0" cy="0" rx="125" ry="40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.45" transform="rotate(22)" />

    <!-- Мягкое свечение сзади -->
    <circle cx="0" cy="0" r="75" fill="#f59e0b" opacity="0.15" />

    <!-- Тело круассана / витой формы -->
    <!-- Основная дуга круассана -->
    <path d="M-65 15 
             C-75 -25, -40 -60, 0 -62 
             C40 -60, 75 -25, 65 15 
             C55 45, 20 58, 0 58 
             C-20 58, -55 45, -65 15 Z" 
          fill="url(#pastry-glow)" />

    <!-- Слои и рельеф выпечки -->
    <path d="M-50 -10 C-35 -40, -10 -48, 15 -42 C-10 -25, -30 -15, -50 -10" fill="#fde68a" opacity="0.6" />
    <path d="M-25 10 C-10 -15, 20 -20, 45 -12 C20 0, -5 5, -25 10" fill="#fef3c7" opacity="0.75" />
    <path d="M-40 25 C-15 35, 15 35, 40 20 C15 28, -15 28, -40 25" fill="#78350f" opacity="0.7" />

    <!-- Белая/кремовая лента-глазурь, обвивающая выпечку -->
    <path d="M-75 -5 
             C-50 -35, 0 -30, 50 -10 
             C70 0, 55 35, 15 42 
             C-25 48, -60 25, -45 -5 
             C-35 -25, 10 -20, 45 -5" 
          fill="none" 
          stroke="url(#ribbon-grad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Блики и посыпка -->
    <circle cx="-15" cy="-25" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="20" cy="-15" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="35" cy="5" r="1.8" fill="#ffffff" opacity="0.8" />
    <circle cx="-30" cy="12" r="2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 4. Нижняя светлая секция листа -->
  <!-- Описание слева -->
  <g transform="translate(65, 495)">
    <text x="0" y="0" font-family="'Montserrat', Arial, sans-serif" font-weight="700" font-size="11" fill="#18181b" letter-spacing="1.5">ABOUT CASE</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#4b5563" line-height="16">
      GRAFFICO is coffee and specialized bakery located in
    </text>
    <text x="0" y="36" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">
      Milan. We created a modern visual identity, 3D brand
    </text>
    <text x="0" y="52" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">
      assets, and interactive WebGL showcase.
    </text>
  </g>

  <!-- Метаданные справа -->
  <g transform="translate(385, 495)">
    <text x="0" y="0" font-family="'Montserrat', Arial, sans-serif" font-weight="700" font-size="11" fill="#18181b" letter-spacing="1.5">PROJECT SPECS</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Type: Specialized Bakery &amp; Web</text>
    <text x="0" y="36" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Location: Milan, Italy</text>
    <text x="0" y="52" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Tech: Three.js • WebGL • GSAP</text>
  </g>

  <!-- Разделительная тонкая черта -->
  <line x1="65" y1="585" x2="595" y2="585" stroke="#e5e2d8" stroke-width="1" />

  <!-- Секция PUBLIC AWARDS с 3 кругами наград -->
  <text x="65" y="620" font-family="'Montserrat', Arial, sans-serif" font-weight="700" font-size="10.5" fill="#78716c" letter-spacing="2">
    PUBLIC AWARDS
  </text>

  <!-- 3 круглые иконки наград -->
  <g transform="translate(240, 640)">
    <!-- Иконка 1: Awwwards -->
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <circle cx="0" cy="0" r="18" fill="#fef3c7" opacity="0.5" />
    <text x="0" y="5" font-family="'Montserrat', Arial, sans-serif" font-weight="bold" font-size="12" fill="#d97706" text-anchor="middle">🏆</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="9" fill="#78716c" text-anchor="middle">AWWWARDS</text>

    <!-- Иконка 2: FWA -->
    <circle cx="90" cy="0" r="22" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <circle cx="90" cy="0" r="18" fill="#fef3c7" opacity="0.5" />
    <text x="90" y="5" font-family="'Montserrat', Arial, sans-serif" font-weight="bold" font-size="12" fill="#d97706" text-anchor="middle">⭐</text>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="9" fill="#78716c" text-anchor="middle">FWA OF DAY</text>

    <!-- Иконка 3: CSSDA -->
    <circle cx="180" cy="0" r="22" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <circle cx="180" cy="0" r="18" fill="#fef3c7" opacity="0.5" />
    <text x="180" y="5" font-family="'Montserrat', Arial, sans-serif" font-weight="bold" font-size="12" fill="#d97706" text-anchor="middle">🎖️</text>
    <text x="180" y="35" font-family="Arial, sans-serif" font-size="9" fill="#78716c" text-anchor="middle">CSS DESIGN</text>
  </g>

  <!-- Темный футер в самом низу листа -->
  <rect x="35" y="770" width="590" height="75" fill="#141416" />
  <text x="330" y="812" font-family="'Courier New', monospace" font-size="12" fill="#9ca3af" text-anchor="middle" letter-spacing="3">
    [ ‹ PREV ]   •   CASE 02 / 06   •   [ NEXT › ]
  </text>

  <!-- Булавки на листе (2 булавки сверху листа как на фото) -->
  <circle cx="210" cy="50" r="6" fill="#000000" opacity="0.25" transform="translate(1, 2)" />
  <circle cx="210" cy="50" r="5" fill="url(#pin-head-2)" stroke="#475569" stroke-width="0.7" />

  <circle cx="450" cy="50" r="6" fill="#000000" opacity="0.25" transform="translate(1, 2)" />
  <circle cx="450" cy="50" r="5" fill="url(#pin-head-2)" stroke="#475569" stroke-width="0.7" />

  <!-- Булавки по углам крафтовой основы -->
  <circle cx="22" cy="22" r="7" fill="url(#pin-head-2)" stroke="#475569" stroke-width="0.8" />
  <circle cx="638" cy="22" r="7" fill="url(#pin-head-2)" stroke="#475569" stroke-width="0.8" />
  <circle cx="22" cy="858" r="7" fill="url(#pin-head-2)" stroke="#475569" stroke-width="0.8" />
  <circle cx="638" cy="858" r="7" fill="url(#pin-head-2)" stroke="#475569" stroke-width="0.8" />
</svg>
