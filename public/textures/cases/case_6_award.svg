<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660">
  <defs>
    <!-- Картонная подложка крафт -->
    <linearGradient id="kraft-grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfc3af" />
      <stop offset="50%" stop-color="#c5b7a2" />
      <stop offset="100%" stop-color="#b8a994" />
    </linearGradient>

    <!-- Тень листа -->
    <filter id="sheet-shadow-6" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3d3326" flood-opacity="0.3" />
    </filter>

    <!-- Булавка -->
    <radialGradient id="pin-head-6" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>

  <!-- 1. Крафтовая подложка -->
  <rect x="0" y="0" width="880" height="660" rx="3" fill="url(#kraft-grad-6)" />
  <rect x="0" y="0" width="880" height="660" rx="3" fill="none" stroke="#aa9b86" stroke-width="1.5" />

  <!-- 2. Белый лист бумаги с полями -->
  <g filter="url(#sheet-shadow-6)">
    <rect x="40" y="55" width="800" height="550" rx="2" fill="#faf9f6" />
    <rect x="40" y="55" width="800" height="550" rx="2" fill="none" stroke="#e8e4db" stroke-width="1" />
  </g>

  <!-- 3. Текст награды сверху: Honorable Mention - Feb 11, 2026 -->
  <text x="440" y="195" 
        font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="600" 
        font-size="18.5" 
        fill="#52525b" 
        text-anchor="middle" 
        letter-spacing="2.5">
    Honorable Mention - Feb 11, 2026
  </text>

  <!-- 4. Огромный заголовок GRAFFICO по центру (в точности как на фото) -->
  <text x="440" y="340" 
        font-family="'Montserrat', 'Arial Black', 'Helvetica Neue', sans-serif" 
        font-weight="900" 
        font-size="96" 
        fill="#111113" 
        text-anchor="middle" 
        letter-spacing="5">
    GRAFFICO
  </text>

  <!-- 5. Логотип и подпись Graffico снизу -->
  <g transform="translate(375, 395)">
    <circle cx="18" cy="18" r="14" fill="#18181b" />
    <circle cx="18" cy="18" r="9" fill="#ffffff" />
    <circle cx="18" cy="18" r="4.5" fill="#dc2626" />
    <text x="45" y="25" 
          font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="700" 
          font-size="21" 
          fill="#18181b" 
          letter-spacing="1">
      Graffico
    </text>
  </g>

  <!-- 6. Центральная булавка сверху белого листа (как на фото) -->
  <circle cx="440" cy="72" r="5.5" fill="#000000" opacity="0.25" transform="translate(1, 2)" />
  <circle cx="440" cy="72" r="5" fill="url(#pin-head-6)" stroke="#475569" stroke-width="0.7" />

  <!-- Булавки по углам крафтовой основы -->
  <circle cx="20" cy="20" r="7" fill="url(#pin-head-6)" stroke="#475569" stroke-width="0.8" />
  <circle cx="860" cy="20" r="7" fill="url(#pin-head-6)" stroke="#475569" stroke-width="0.8" />
  <circle cx="20" cy="640" r="7" fill="url(#pin-head-6)" stroke="#475569" stroke-width="0.8" />
  <circle cx="860" cy="640" r="7" fill="url(#pin-head-6)" stroke="#475569" stroke-width="0.8" />
</svg>
